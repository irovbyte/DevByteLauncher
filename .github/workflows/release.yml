name: Release

on:
  push:
    branches:
      - master
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag'
        required: false

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine Version Tag
        id: version_step
        shell: pwsh
        run: |
          if ('${{ github.ref_type }}' -eq 'tag') {
            $tag = '${{ github.ref_name }}'
          } elseif ('${{ inputs.tag_name }}' -ne '') {
            $tag = '${{ inputs.tag_name }}'
          } else {
            [xml]$xml = Get-Content version.props
            $ver = $xml.Project.PropertyGroup.Version
            $tag = "v$ver"
          }
          Write-Output "tag=$tag" >> $env:GITHUB_OUTPUT

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore DevByteLauncher.csproj

      - name: Publish Windows executable
        run: dotnet publish DevByteLauncher.csproj -c Release -r win-x64 --self-contained -p:PublishSingleFile=true -o release-win

      - name: Publish Linux executable
        run: |
          dotnet publish DevByteLauncher.csproj -c Release -r linux-x64 --self-contained -p:PublishSingleFile=true -o release-linux
          Move-Item release-linux/DevByteLauncher release-linux/DevByteLauncher-linux-x64
          tar -czf release-linux/DevByteLauncher-linux-x64.tar.gz -C release-linux DevByteLauncher-linux-x64

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version_step.outputs.tag }}
          files: |
            release-win/DevByteLauncher.exe
            release-linux/DevByteLauncher-linux-x64
            release-linux/DevByteLauncher-linux-x64.tar.gz
          generate_release_notes: true
          draft: false
          prerelease: false
